<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>訂單進度</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap"
        rel="stylesheet" />
    <style>
        body {
            font-family: 'Noto Sans TC', sans-serif;
        }
    </style>
</head>

<body class="bg-[#f8fafc] flex flex-col min-h-screen overflow-y-auto antialiased text-gray-900">
    <div class="w-full max-w-md mx-auto min-h-screen flex flex-col relative pb-10">
        <div
            class="px-5 py-4 border-b border-gray-100 flex justify-between items-center bg-white sticky top-0 z-50 shadow-sm">
            <h3 class="font-black text-gray-800 text-lg tracking-wide">訂單進度</h3>
            <button id="btn-back-to-menu"
                class="hidden text-sm font-bold text-emerald-600 bg-emerald-50 hover:bg-emerald-100 px-3 py-1.5 rounded-lg border border-emerald-200 active:scale-95 transition-all flex items-center gap-1">
                <i data-lucide="plus" class="w-4 h-4"></i> 加點餐點
            </button>
        </div>

        <div class="flex-1 p-5 flex flex-col mt-2" id="tracking-cards-container">
            <div class="text-center py-20">
                <i data-lucide="loader" class="w-10 h-10 animate-spin mx-auto text-emerald-500 mb-4"></i>
                <p class="text-gray-500 font-bold">載入訂單中...</p>
            </div>
        </div>
    </div>

    <div id="custom-alert-modal"
        class="fixed inset-0 z-[10000] flex items-center justify-center p-4 hidden transition-opacity duration-300 opacity-0">
        <div class="absolute inset-0 bg-gray-900/70 backdrop-blur-sm" id="btn-close-alert-bg"></div>
        <div
            class="relative bg-white w-full max-w-[320px] rounded-[24px] shadow-2xl p-8 text-center transform scale-95 transition-all duration-300 modal-card">
            <div
                class="w-16 h-16 bg-amber-50 border-4 border-amber-100 text-amber-500 rounded-full flex items-center justify-center mx-auto mb-5">
                <i data-lucide="alert-triangle" class="w-8 h-8"></i>
            </div>
            <h3 class="text-xl font-black text-gray-800 mb-2">訂單進行中！</h3>
            <p class="text-sm font-bold text-gray-500 mb-8 leading-relaxed">請保留此畫面，<br>以免錯過取餐叫號喔！</p>
            <button id="btn-close-custom-alert"
                class="w-full bg-amber-500 hover:bg-amber-600 text-white font-bold py-3.5 rounded-xl transition-all active:scale-95 shadow-md shadow-amber-500/20">
                我知道了
            </button>
        </div>
    </div>

    <script src="js/config.local.js"></script>
    <script src="js/supabase-shim.js"></script>
    <script src="js/status.js"></script>
</body>

</html>
