<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>正在導引至您的餐廳...</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 flex items-center justify-center min-h-screen">
  <div class="text-center">
    <div class="inline-block animate-spin rounded-full h-12 w-12 border-4 border-emerald-500 border-t-transparent mb-4"></div>
    <p class="text-gray-500 font-medium">系統檢查中，請稍候...</p>
  </div>
  <script src="js/config.local.js"></script>
  <script src="js/supabase-shim.js"></script>
  <script>
    async function checkAccess() {
      const { data: { user } } = await supabaseClient.auth.getUser();
      if (!user) { window.location.href = 'login.html'; return; }
      const { data: store } = await supabaseClient.from('stores').select('is_initialized').single();
      window.location.href = (store && store.is_initialized) ? 'dashboard.html' : 'onboarding.html';
    }
    checkAccess();
  </script>
</body>
</html>
